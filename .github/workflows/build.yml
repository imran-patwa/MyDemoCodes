# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "SingletonDemo" ]
  pull_request:
    branches: [ "SingletonDemo" ]

jobs:
  build:

    runs-on: [self-hosted]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x   
    - name: Restore
      run: dotnet restore SingletonDemo/SingletonDemo.sln
    - name: Build 
      run: dotnet build SingletonDemo/SingletonDemo.sln --no-restore
    - name: Test 
      run: dotnet test SingletonDemo/SingletonDemo.sln --no-build --verbosity normal
