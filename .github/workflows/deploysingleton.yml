name: Deploy

on:
  push:
    branches: [ "SingletonDemo" ]
  
jobs:
  deploy:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build -f SingletonDemo/Dockerfile -t imranpatwa/singletondemo SingletonDemo
    - run: echo "${{secrets.DOCKERHUB_PASSWORD}}" | docker login -u ${{secrets.DOCKERHUB_USERNAME}} --password-stdin
    - name: Run Container
      run: |
        docker run -d \
          -e CosmosDb__Account="${{ secrets.COSMOS_ACCOUNT }}" \
          -e CosmosDb__Key="${{ secrets.COSMOS_KEY }}" \
          imranpatwa/singletondemo:latest
    - run: docker push imranpatwa/singletondemo:latest
