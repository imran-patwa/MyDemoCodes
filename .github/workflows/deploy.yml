name: Deploy

on:
  push:
    branches: [ "GitHubActions" ]
  
jobs:
  deploy:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build -f GitHubActions/Dockerfile -t imranpatwa/githubactions GitHubActions
    - run: echo "${{secrets.DOCKERHUB_PASSWORD}}" | docker login -u ${{secrets.DOCKERHUB_USERNAME}} --password-stdin
    - run: docker push imranpatwa/githubactions:latest
